# Lanes — every row is an EDGE with a nameable law. from/to are building ids.
lanes:
  - from: spec
    to: website
    rel: projects-to
    law: "pin + bot ONE-PR (LENS-011): the site resyncs against .github/nika-spec-pin.json — fetched BY SHA, commit+tree verified, one idempotent PR per pin"
    evidence: ".github/nika-spec-pin.json + .github/workflows/spec-resync.yml (this repo)"
  - from: spec
    to: docs
    rel: projects-to
    law: "direct projection (the free twin — no pin yet; noted for a future train)"
    evidence: "the two-projections asymmetry recorded in the total-map handoff §I.4-8"
  - from: spec
    to: engine
    rel: vendors-to
    law: "the pack: examples/manifest.yaml + spec chapters vendored into crates/nika-pack (the binary embeds the pack)"
    evidence: "spec examples/manifest.yaml header: 'the reference engine embeds this pack'"
  - from: engine
    to: website
    rel: vendors-to
    law: "engine@release vendoring (D1): catalog data + ADR index fetched BY SHA at the release pin, digest-receipted"
    evidence: ".github/nika-engine-pin.json + scripts/engine-resync.mjs + public/engine/PROVENANCE.json (this repo)"
  - from: engine
    to: website
    rel: heals
    law: "release-heal: the site's ENGINE_VERSION string follows engine releases by bot self-push"
    evidence: ".github/workflows/release-heal.yml + scripts/sync-version.mjs (this repo)"
  - from: estate
    to: engine
    rel: mirrors-to
    law: "ESTATE_PIN mirror: scripts/estate.py byte-identical at the pinned rev, CI-blocked on divergence"
    evidence: "engine .github/workflows/estate.yml mirror job + engine ESTATE_PIN"
  - from: estate
    to: spec
    rel: mirrors-to
    law: "ESTATE_PIN mirror: scripts/estate.py byte-identical at the pinned rev, CI-blocked on divergence"
    evidence: "spec .github/workflows/conformance.yml mirror job + spec ESTATE_PIN"
  - from: estate
    to: docs
    rel: mirrors-to
    law: "ESTATE_PIN mirror: scripts/estate.py byte-identical at the pinned rev, CI-blocked on divergence"
    evidence: "docs .github/workflows/gate.yml mirror job + docs ESTATE_PIN"
  - from: estate
    to: registry
    rel: mirrors-to
    law: "ESTATE_PIN mirror: the registry joined the four-repo closure (nika-registry a51c6ba)"
    evidence: "nika-estate MIGRATION.md closure commits"
  - from: estate
    to: website
    rel: mirrors-to
    law: "ESTATE_PIN mirror: this repo joined the dance 2026-08-01 (E1) — the mirror job blocks on divergence"
    evidence: "ESTATE_PIN + .github/workflows/estate.yml mirror job (this repo)"
  - from: engine
    to: vscode
    rel: locksteps-with
    law: "release-train lockstep: the extension version follows the engine minor"
    evidence: "the 0.106 release train (engine · vscode Marketplace+OpenVSX published together)"
  - from: engine
    to: client-sdk
    rel: locksteps-with
    law: "release-train lockstep: the SDK version follows the engine minor"
    evidence: "the 0.106 release train (engine · npm published together)"
  - from: engine
    to: homebrew
    rel: vendors-to
    law: "the brew door: the formula bumps to each release's digest-verified assets"
    evidence: "homebrew-tap formula history following engine releases"
