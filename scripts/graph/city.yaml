# fence carries the census; each repo's own README carries its `**Root**`
# line). This file is the site's AUTHORED declaration of that public map —
# every row cites what proves it; the lanes only exist where a law can be
# named (a lane without a citable law does not enter the graph). The
# archives are listed honestly: history does not get erased (H.3).
#
# Estate class: authored (site voice) — the ONE authored input the graph
# compiler accepts, declared voice: true to the doctor's §J.1 typing gate.

