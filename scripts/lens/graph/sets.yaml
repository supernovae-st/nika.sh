          - { label: The specification, to: /language/spec }
          # /errors has NOT re-homed: its rooms are cited by docs_url in every
          # finding the binary prints, so it moves with the engine wagon
          - { label: Error codes, to: /errors }
          - { label: Standard library, to: /language/stdlib }
          - { label: Types, to: /language/types }
          - { label: Permits, to: /language/permits }
          - { label: Conformance, to: /language/conformance }
      - col: Workflows
        items:
