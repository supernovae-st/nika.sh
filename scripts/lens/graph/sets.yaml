# ─── the chrome (§4.11-4.12 · nav + footer as projections) ──────────────────
# The Reference panel and the footer's anatomy columns DERIVE: items carry a
# `ref` (a set/layer node id) and the compiler resolves url · count · soon
# (soon = the node's page has not landed yet, or its slot awaits a wave —
# WO-4 flips hub_exists and the chrome gains the links mechanically, zero
# nav edits). The Product panel and the last two footer columns are AUTHORED
# intent (linted: no em dash · no intensifiers · sentence case).
nav:
  # ── TABLE RASE 2026-08-02 (operator: « la navbar n'a aucun sens · supprime
  #    tout · refais par rapport au nouveau monde »). The old bar named OUR
  #    ontology — « Product » and « Reference » are words from our own layer
  #    model, not questions a visitor asks — and hid eleven doors behind two
  #    mega-panels with a constellation drawing at the top of one of them.
  #
  #    The eight worlds ARE the navigation now. Six flat links, no dropdown,
  #    no panel: each one is a WORLD with its own hub, and the hub is where a
  #    reader browses. A dropdown that lists what a page already lists is a
  #    second copy of that page in the chrome.
  bar:
    links:
      - { label: How it works, to: /how }
      - { label: The language, to: /language }
      - { label: Workflows, to: /workflows }
      - { label: Catalog, to: /catalog }
      - { label: Docs, external: true }   # href = DOCS const (content.ts)
