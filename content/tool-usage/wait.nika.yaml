# a declared pause — relative duration XOR absolute until
nika: let-the-index-settle

permits:
  net: { http: ["docs.example.com", "hooks.example.com"] }
  exec: false
  tools: ["nika:fetch", "nika:notify", "nika:wait"]

tasks:
  publish:
    invoke:
      tool: "nika:notify"
      args:
        target: "https://hooks.example.com/deploys"
        message: "docs published"

  settle:
    after:
      publish: success
    invoke:
      tool: "nika:wait"
      args: { duration: "30s" }

  verify:
    after:
      settle: success
    invoke:
      tool: "nika:fetch"
      args:
        url: "https://docs.example.com/health"
        mode: jq
        jq: ".status"
