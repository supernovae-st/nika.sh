nika: v1
workflow:
  id: runs-per-month
  description: "rows in, one deterministic svg out — same bytes every run"

permits:
  fs:
    write: ["./charts/runs.svg"]
  exec: false
  tools: ["nika:chart"]

tasks:
  render:
    invoke:
      tool: "nika:chart"
      args:
        data:
          - { month: "jan", runs: 41 }
          - { month: "feb", runs: 57 }
          - { month: "mar", runs: 64 }
        chart: { type: bar, x: month, y: runs }
        out: "./charts/runs.svg"

outputs:
  receipt: ${{ tasks.render.output }}
