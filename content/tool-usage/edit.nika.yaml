# literal find/replace in place — not regex, no surprises
nika: bump-log-level

permits:
  fs:
    read: ["./config.toml"]
    write: ["./config.toml"]
  exec: false
  tools: ["nika:edit"]

tasks:
  bump:
    invoke:
      tool: "nika:edit"
      args:
        path: "./config.toml"
        find: 'level = "info"'
        replace: 'level = "debug"'
        count: 1

outputs:
  changed: ${{ tasks.bump.output }}
