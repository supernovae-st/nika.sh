# content-address a file — the receipt survives the run
nika: pin-the-artifact

permits:
  exec: true
  tools: ["nika:hash"]

tasks:
  artifact:
    exec:
      shell: "cat report.md | tr -d '\r'"
      cwd: "./dist"
      env:
        LC_ALL: "C"

  pin:
    with:
      artifact: ${{ tasks.artifact.output }}
    invoke:
      tool: "nika:hash"
      args:
        content: "${{ with.artifact }}"
        algo: sha256

outputs:
  sha256: ${{ tasks.pin.output }}
