# timestamp arithmetic without a shell date incantation
nika: the-review-window

tasks:
  deadline:
    invoke:
      tool: "nika:date"
      args:
        op: add
        base: "2026-07-01T09:00:00Z"
        duration: "7d"

  days_left:
    with:
      deadline: ${{ tasks.deadline.output }}
    invoke:
      tool: "nika:date"
      args:
        op: diff
        start: "2026-07-01T09:00:00Z"
        end: "${{ with.deadline }}"
        unit: days

outputs:
  deadline: ${{ tasks.deadline.output }}
