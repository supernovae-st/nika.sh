name: estate

# E2 — the first building past observation (§J.2 vague 1: E1 PUIS E2).
# The estate manifest (estate.yaml · schema 2, the glob estate) declares
# every tracked file's provenance: authored · authored-pin · generated ·
# pinned-copy · testimonial · foreign — and here, unlike the sibling
# repos still at E0, DRIFT BLOCKS: a commit that changes files without
# regenerating the manifest is red (stage, then
# `python3 scripts/estate.py --write`). Exit 5 = drift · exit 3 =
# coverage hole (the ssot-compiler convention — distinguishable from the
# sibling gates' exit 1 in CI logs). This is the only blocking gate over
# the 28 pattern rows that cover ~91% of the tree (the vitest reader
# re-hashes the files: rows and spawns this same check).
#
# TWO JOBS, TWO POSTURES — both block. `estate` judges the manifest (E2).
# `mirror` proves scripts/estate.py is byte-identical to nika-estate at
# the rev in ESTATE_PIN — this repo JOINED the dance 2026-08-01 (E1 · the
# pre-reconciliation fork died; the curated evidence lives on as data in
# scripts/estate_rules.py). Editing a mirrored file is never an
# observation, it is a bug, so it fails the run. That is why this
# workflow also fires on push: main takes direct pushes here, and a gate
# that only watches pull requests would not see one.
#
# SECURITY: no github.event data reaches the shell (house convention).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The estate matches the tree (E2 — drift blocks · fix: stage, then estate.py --write)
        run: python3 scripts/estate.py --check

  mirror:
    name: The estate tool is the shared one
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: scripts/estate.py is byte-identical to nika-estate at the pinned rev
        run: |
          pin="$(grep -v '^#' ESTATE_PIN | head -1 | tr -d '[:space:]')"
          url="https://raw.githubusercontent.com/supernovae-st/nika-estate/${pin}/scripts/estate.py"
          curl -fsSL "$url" -o /tmp/estate-canonical.py
          if ! cmp -s /tmp/estate-canonical.py scripts/estate.py; then
            echo "::error file=scripts/estate.py::diverges from nika-estate@${pin} — the tool is shared: change it upstream, bump ESTATE_PIN, re-mirror"
            diff -u /tmp/estate-canonical.py scripts/estate.py | head -60
            exit 1
          fi
          if [ ! -x scripts/estate.py ]; then
            echo "::error file=scripts/estate.py::has a shebang but is not executable · cmp compares content and raw.githubusercontent serves no modes, so the mirror carries the bit itself"
            exit 1
          fi
          echo "✓ scripts/estate.py is byte-identical to nika-estate@${pin} and executable"
